# USB stereo camera recording for V1/Capture/record_usb.py
# Camera: "3D USB Camera" (USB ID 32e4:0035), one side-by-side frame = left | right
# Run on the Pi:  python3 V1/Capture/record_usb.py --config V1/configs/capture_usb.yaml

device: /dev/video0           # from `v4l2-ctl --list-devices` → "3D USB Camera" (first node)

video:
  width: 3840                 # DEFAULT: 3840x1080 = 1920x1080 per eye. 2560x720 halves file size.
  height: 1080
  fps: 30                     # DEFAULT: 30 (Pi 4 keeps up at 3840x1080). Camera supports 60.
  # MJPG is copied straight from the camera (no re-encode): ~44 GB/hour at 3840x1080@30.

controls:                     # passed to `v4l2-ctl --set-ctrl` before recording (names from --show-controls)
  power_line_frequency: 2     # DEFAULT: 2 = 60 Hz (US mains). Camera ships at 1 = 50 Hz → light flicker bands.
  # Lock in the lab once lighting is set (values below are this camera's ranges/defaults):
  # auto_exposure: 1                  # 1 = manual, 3 = auto (Aperture Priority, default)
  # exposure_time_absolute: 156       # units of 100 µs (156 = 15.6 ms); must be ≤ 333 at 30 fps
  # gain: 110                         # 0–255
  # white_balance_automatic: 0        # 0 = off (then temperature applies)
  # white_balance_temperature: 4600   # 2800–6500 K

recording:
  out_dir: recordings         # gitignored
  segment_s: 300              # new file every 5 min
  duration_s: 60              # total; 0/null = until Ctrl-C
  min_free_gb: 3              # stop before the SD card fills
  label: test                 # in filenames, e.g. prefeed
